<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeskAPI — Resources and Bookings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>DeskAPI · Resources</h1>
    <button id="logout-btn" class="btn-small btn-delete">Log Out</button>
  </header>

  <main>
    <section class="card">
      <h2>Make a booking</h2>
      <form id="booking-form">
        <div>
          <label for="booking-type">Resource type</label>
          <select id="booking-type" required></select>
        </div>
        <div>
          <label for="booking-resource">Resource</label>
          <select id="booking-resource" required></select>
        </div>
        <div class="row">
          <div>
            <label for="booking-start">Start</label>
            <input type="datetime-local" id="booking-start" required />
          </div>
          <div>
            <label for="booking-end">End</label>
            <input type="datetime-local" id="booking-end" required />
          </div>
        </div>
        <button type="submit">Book</button>
        <p id="booking-message" class="message"></p>
      </form>
    </section>

    <section class="card">
      <h2>My bookings</h2>
      <table>
        <thead>
          <tr>
            <th>Resource</th>
            <th>Start</th>
            <th>End</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookings-rows">
          <tr><td colspan="5">Loading bookings...</td></tr>
        </tbody>
      </table>
    </section>

    <section class="card hidden" id="admin-section">
      <h2>Add resource (admin)</h2>
      <form id="resource-form">
        <div class="row">
          <div>
            <label for="resource-name">Name</label>
            <input type="text" id="resource-name" required />
          </div>
          <div>
            <label for="resource-type-select">Type</label>
            <select id="resource-type-select" required></select>
            <input type="text" id="resource-type-new" class="hidden" placeholder="New type name..." />
          </div>
        </div>
        <div>
          <label for="resource-location-select">Location</label>
          <select id="resource-location-select" required>
            <option value="" disabled selected>Select a city</option>
            <option value="AU-NSW">Sydney, NSW</option>
            <option value="AU-VIC">Melbourne, VIC</option>
            <option value="AU-QLD">Brisbane, QLD</option>
            <option value="AU-WA">Perth, WA</option>
            <option value="AU-SA">Adelaide, SA</option>
            <option value="AU-TAS">Hobart, TAS</option>
            <option value="AU-NT">Darwin, NT</option>
            <option value="AU-ACT">Canberra, ACT</option>
            <option value="__other__">+ Other (type manually)</option>
          </select>
          <input type="text" id="resource-location-new" class="hidden" placeholder="Custom location..." />
        </div>
        <div>
          <label>Attributes (optional)</label>
          <div id="attributes-list"></div>
          <button type="button" id="add-attribute-btn" class="btn-small btn-edit">+ Add attribute</button>
        </div>
        <button type="submit">Create resource</button>
        <p id="resource-message" class="message"></p>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
